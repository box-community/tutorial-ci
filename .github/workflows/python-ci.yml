name: Python tutorial CI

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON list of Python versions to test.
        type: string
        default: '["3.11", "3.14"]'
      working-directory:
        description: Directory that contains requirements.txt and the sample's modules.
        type: string
        default: .

permissions:
  contents: read

jobs:
  smoke:
    name: Install and smoke test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.python-versions) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ inputs.working-directory }}/requirements.txt

      # No lockfile: installs the newest versions requirements.txt allows,
      # which is what a reader following the tutorial gets.
      - run: python -m pip install -r requirements.txt

      - run: python -m pip check

      # Kept inline so it always matches the version of this workflow the caller pinned.
      - name: Import every module and check Flask /health
        run: |
          python - <<'PY'
          import importlib
          import os
          import re
          import sys
          from pathlib import Path

          root = Path.cwd()
          sys.path.insert(0, str(root))

          # Placeholder values for every variable in .env.example, so modules that
          # read configuration at import time load without real credentials.
          example = root / ".env.example"
          if example.exists():
              for line in example.read_text().splitlines():
                  match = re.match(r"\s*([A-Z][A-Z0-9_]*)\s*=", line)
                  if match:
                      name = match.group(1)
                      os.environ[name] = "0" if name.endswith("_ID") else "ci-smoke"

          failures = []
          flask_apps = []
          for path in sorted(root.glob("*.py")):
              try:
                  module = importlib.import_module(path.stem)
              except Exception as error:
                  failures.append(f"{path.name}: {type(error).__name__}: {error}")
                  continue
              print(f"Imported {path.name}")
              app = getattr(module, "app", None)
              if type(app).__name__ == "Flask":
                  flask_apps.append((path.name, app))

          for filename, app in flask_apps:
              routes = {rule.rule for rule in app.url_map.iter_rules()}
              if "/health" not in routes:
                  print(f"{filename}: Flask app has no /health route, skipping")
                  continue
              status = app.test_client().get("/health").status_code
              if status != 200:
                  failures.append(f"{filename}: GET /health returned {status}")
              else:
                  print(f"{filename}: GET /health returned 200")

          if failures:
              print("\nSmoke test failed:")
              for failure in failures:
                  print(f"  {failure}")
              sys.exit(1)
          print("\nSmoke test passed")
          PY
